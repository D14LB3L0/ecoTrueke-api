<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; font-size:12px">

    <div style="max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 5px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
        <div style="color: white; padding: 8px 0px 4px 10px; text-align: left;">
            <img src="{LogoUrl}" alt="Logo" style="width: auto; height: 20px; margin-left:10px" />
        </div>

        <div style="padding: 20px;">
            {Title}
            <p style="margin: 10px 0 0 0">{Content}</p>
            <p style="margin: 10px 0 0 0">Saludos,</p>
            <p style="margin:0">El equipo de Ecotrueke</p>
        </div>
    </div>

</body>
</html>
